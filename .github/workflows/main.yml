name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Create iOS Files if Missing
        run: |
          if [ ! -d "ios" ]; then
            echo "Creating iOS folder..."
            flutter create . --platforms=ios --org com.handasaha.app
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Handasaha.ipa Payload
          mv Handasaha.ipa ../../../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Handasaha-Unsigned-IPA
          path: Handasaha.ipa
